<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexim Bot Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; background: #f5f5f5; }
        h1 { color: #333; }
        .section { background: #fff; padding: 1em 2em; margin-bottom: 2em; border-radius: 8px; box-shadow: 0 2px 8px #0001; }
        table { width: 100%; border-collapse: collapse; margin-top: 1em; }
        th, td { padding: 0.5em 1em; border-bottom: 1px solid #eee; }
        th { background: #fafafa; }
    </style>
</head>
<body>
    <h1>Nexim Bot Administration</h1>
    <div class="section">
        <h2>Bot Status</h2>
        <ul>
            <li><strong>Playlist Length:</strong> <span id="playlist-length">0</span></li>
        </ul>
    </div>
    <div class="section">
        <h2>Current Playlist</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>URL</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="playlist-table">
                <!-- Playlist items will be inserted here by JS -->
            </tbody>
        </table>
    </div>
    <script>
        fetch('/playlist')
            .then(response => response.json())
            .then(data => {
                const table = document.getElementById('playlist-table');
                const lengthSpan = document.getElementById('playlist-length');
                lengthSpan.textContent = data.length;
                data.forEach((item, idx) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>${idx + 1}</td><td>${item.url}</td><td>${item.status}</td>`;
                    table.appendChild(row);
                });
            });
    </script>
</body>
</html>
